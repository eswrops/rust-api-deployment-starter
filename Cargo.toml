[package]
name = "rust-api"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
axum = "0.8.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6", features = ["trace", "limit", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# "macros" is required for the compile-time `migrate!` macro (embeds the
# migrations directory into the binary, keeping VM deploys single-file).
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# Integration tests spawn and signal the server binary.
tokio = { version = "1", features = ["process", "time", "sync"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
incremental = false
strip = "debuginfo"
panic = "unwind"
