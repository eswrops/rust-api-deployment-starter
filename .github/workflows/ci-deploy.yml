name: Rust API CI and Deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Build Linux AMD64 release
        run: GIT_SHA="$GITHUB_SHA" cargo build --release --locked
      - name: Package artifact
        run: |
          cp target/release/rust-api rust-api
          sha256sum rust-api > rust-api.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: rust-api-linux-amd64
          path: |
            rust-api
            rust-api.sha256
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: rust-api-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rust-api-linux-amd64
      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
      - name: Upload through IAP and atomically activate
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCE_INSTANCE: ${{ vars.GCE_INSTANCE }}
          GCE_ZONE: ${{ vars.GCE_ZONE }}
        run: |
          set -Eeuo pipefail
          test -n "$GCP_PROJECT_ID"
          test -n "$GCE_INSTANCE"
          test -n "$GCE_ZONE"
          sha256sum --check rust-api.sha256
          key="$RUNNER_TEMP/rust-api-deploy"
          ssh-keygen -q -t ed25519 -N '' -f "$key"
          common=(
            --project="$GCP_PROJECT_ID"
            --zone="$GCE_ZONE"
            --tunnel-through-iap
            --ssh-key-file="$key"
            --ssh-key-expire-after=10m
            --quiet
          )
          # This adds a ten-minute instance metadata key for the restricted
          # deploy user; no private key is stored in GitHub or Google Cloud.
          gcloud compute ssh "deploy@${GCE_INSTANCE}" "${common[@]}" --command=true
          gcloud compute scp rust-api \
            "deploy@${GCE_INSTANCE}:/home/deploy/incoming/rust-api-${GITHUB_SHA}" \
            "${common[@]}"
          digest="$(sha256sum rust-api | awk '{print $1}')"
          gcloud compute ssh "deploy@${GCE_INSTANCE}" "${common[@]}" \
            --command="sudo /usr/local/sbin/rust-api-activate '${GITHUB_SHA}' '${digest}'"
