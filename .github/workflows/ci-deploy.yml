name: Rust API CI and Deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      # Full manual memory benchmark: run this workflow with 15000. Capacity
      # testing is separated from release/deployment at the job level: the
      # build and deploy jobs below are unreachable from a dispatch that does
      # not explicitly set deploy_production, and hold no OIDC capability.
      idle_connections:
        description: "Idle keep-alive connections for the memory benchmark"
        default: "3000"
        type: string
      # Manual release/deploy path. Leave false for benchmark/capacity
      # dispatches; set true only to release and deploy the current tip of
      # main (the repository variable PRODUCTION_DEPLOY_ENABLED must also
      # be "true").
      deploy_production:
        description: "Release build and production deployment of the current main tip"
        default: false
        type: boolean

# Cancel superseded pull-request runs; push runs (the deploy path) are never
# cancelled. Push groups are per-SHA so concurrent pushes queue independently;
# the deploy job's concurrency group serializes production activations.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default: no job can mint Google credentials. The deploy job is the only
# job granted `id-token: write` (job-scoped below), so pull-request runs of
# verify/benchmark/security — and manual benchmark dispatches — hold nothing
# beyond repository read access.
permissions:
  contents: read

# Third-party actions are pinned to reviewed full commit SHAs (the tag each
# SHA resolves to is noted next to it). Update pins deliberately.
env:
  RUST_VERSION: "1.99.1"
  UPSTREAM_CHALLENGE_REF: "16fb03ebee64ea62ec7b90f0afcfe199afc4f56a"

jobs:
  # Production releases/deployments are only rebuilt when something that
  # affects the deployed binary changed; benchmark-only or docs-only pushes
  # skip the release build and deployment entirely. The classification logic
  # lives in .github/scripts/deploy-changes.sh (tested below) so the full
  # push range, not just HEAD^, is considered.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
      benchmark: ${{ steps.filter.outputs.benchmark }}
      security: ${{ steps.filter.outputs.security }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Test change-detection logic
        run: bash .github/scripts/test-deploy-changes.sh
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/deploy-changes.sh >>"$GITHUB_OUTPUT"

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # `cargo test` runs every integration test, including
      # tests/migrations.rs (apply + idempotency + documented schema), so the
      # migration gate does not need a second, redundant invocation.
      - run: cargo test --locked
      - name: Ops tooling tests (mocked GCS, mocked service manager)
        run: |
          bash ops/backup/test/test-rust-api-backup.sh
          bash ops/backup/test/test-backup-freshness-check.sh
          bash ops/test/test-rust-api-activate.sh
          bash ops/test/test-backfill-release-digests.sh
          bash ops/test/test-backfill-preflight.sh
          bash ops/test/test-install-rust-api-activation.sh
          bash .github/scripts/test-deploy-changes.sh
          bash .github/scripts/test-deploy-still-current.sh

  benchmark:
    # Pull requests always run the full suite (regression gate). Pushes to
    # main run it only when the benchmark crate changed or a release build
    # is happening (the deploy path requires this job as its gate); a
    # docs-only push skips it.
    if: >-
      github.event_name != 'push' || needs.changes.outputs.benchmark == 'true'
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out upstream challenge at pinned revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: arjaythedev/twelve-dollar-server-challenge
          ref: ${{ env.UPSTREAM_CHALLENGE_REF }}
          path: upstream
      - name: Install pinned Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: benchmark/feed-api
      - name: Format
        run: cargo fmt --manifest-path benchmark/feed-api/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path benchmark/feed-api/Cargo.toml --all-targets --locked -- -D warnings
      - name: Regression tests
        run: cargo test --manifest-path benchmark/feed-api/Cargo.toml --locked
      - name: Install sqlite3 CLI and dev header if missing
        run: |
          missing=()
          command -v sqlite3 >/dev/null 2>&1 || missing+=(sqlite3)
          [ -f /usr/include/sqlite3.h ] || missing+=(libsqlite3-dev)
          if [ ${#missing[@]} -gt 0 ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq "${missing[@]}"
          fi
      - name: Build seed database (50k users / 500k posts / 2M likes)
        run: bash upstream/seed/make-seed.sh
      - name: Upstream test suite (42 checks on a fresh database copy)
        run: bash upstream/test/run.sh benchmark/feed-api
      # Fault-injection and transport-pressure tests (tests/*.py). They reuse
      # the seed built above and the bin/server produced by run.sh's build.
      - name: Commit-failure fault injection (unmodified binary, GNU ld --wrap shim)
        run: bash benchmark/feed-api/tests/commit_check.sh
        env:
          SEED_DB: ${{ github.workspace }}/upstream/seed/feed.db
          SQLITE3_INCLUDE_DIR: /usr/include
      - name: Connection pressure regression (server under nofile=256)
        run: python3 benchmark/feed-api/tests/pressure_regression.py
        env:
          SEED_DB: ${{ github.workspace }}/upstream/seed/feed.db
      - name: Idle keep-alive capacity (deterministic subset, RSS measurement)
        run: python3 benchmark/feed-api/tests/idle_client.py
        env:
          SEED_DB: ${{ github.workspace }}/upstream/seed/feed.db
          IDLE_COUNT: ${{ inputs.idle_connections || '3000' }}

  security:
    if: >-
      github.event_name != 'push' || needs.changes.outputs.security == 'true'
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: cargo-deny (production crate)
        uses: embarkstudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          command: check
          manifest-path: ./Cargo.toml
      - name: cargo-deny (benchmark crate)
        uses: embarkstudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          command: check
          manifest-path: benchmark/feed-api/Cargo.toml

  build:
    # Release builds happen (a) on pushes to main that touch production
    # inputs, or (b) on an explicit dispatch with deploy_production=true.
    # A plain benchmark dispatch (deploy_production unset/false) can never
    # reach this job.
    if: >-
      (
        (github.event_name == 'push' && needs.changes.outputs.deploy == 'true')
        || (github.event_name == 'workflow_dispatch' && inputs.deploy_production == true)
      ) &&
      github.ref == 'refs/heads/main'
    needs: [changes, verify, benchmark, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: Build Linux AMD64 release
        run: GIT_SHA="$GITHUB_SHA" cargo build --release --locked
      - name: Package artifact
        run: |
          cp target/release/rust-api rust-api
          sha256sum rust-api > rust-api.sha256
      - name: Smoke test the built binary (migrations, live+ready, graceful SIGTERM)
        run: bash .github/scripts/release-smoke.sh ./rust-api "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-api-linux-amd64
          path: |
            rust-api
            rust-api.sha256
          if-no-files-found: error
          retention-days: 7

  deploy:
    # Production gate, layered:
    #   1. only pushes to main that touch production inputs, or an explicit
    #      dispatch with deploy_production=true (a benchmark dispatch can
    #      never deploy);
    #   2. the repository variable PRODUCTION_DEPLOY_ENABLED must be exactly
    #      "true" (delete it or set any other value to disable; absent
    #      variable = deploys disabled);
    #   3. the activation step itself re-verifies this run's SHA is still the
    #      tip of main before activating.
    if: >-
      (
        (github.event_name == 'push' && needs.changes.outputs.deploy == 'true')
        || (github.event_name == 'workflow_dispatch' && inputs.deploy_production == true)
      ) &&
      github.ref == 'refs/heads/main' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: [changes, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      # Only the deploy job may request a Google OIDC credential. It is kept
      # out of the workflow-level defaults so no other job can impersonate
      # the deployer service account.
      id-token: write
    concurrency:
      group: rust-api-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Verify this run is still the tip of main
        id: tip
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          echo "this run: $GITHUB_SHA"
          rc=0
          tip="$(bash .github/scripts/deploy-still-current.sh)" || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "tip of main: $tip (current)"
            echo "is_tip=true" >>"$GITHUB_OUTPUT"
          elif [ "$rc" -eq 1 ]; then
            # Superseded: main has moved on and its own run owns production.
            echo "::notice::Superseded: main has advanced to ${tip}; skipping deployment of ${GITHUB_SHA}"
            {
              echo "### Deployment skipped: superseded"
              echo ""
              echo "main is at \`${tip}\`; this run built \`${GITHUB_SHA}\`, which is no"
              echo "longer the tip. The newer commit's run owns the production deployment."
            } >>"$GITHUB_STEP_SUMMARY"
            echo "is_tip=false" >>"$GITHUB_OUTPUT"
          else
            # Exit 2: the tip could not be verified. Fail closed — a
            # deployment that cannot prove it is current must not proceed.
            echo "could not verify the tip of main (deploy-still-current exit $rc); failing closed" >&2
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.tip.outputs.is_tip == 'true'
        with:
          name: rust-api-linux-amd64
      - name: Authenticate to Google Cloud with GitHub OIDC
        if: steps.tip.outputs.is_tip == 'true'
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Install Google Cloud CLI
        if: steps.tip.outputs.is_tip == 'true'
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Upload through IAP and atomically activate
        if: steps.tip.outputs.is_tip == 'true'
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCE_INSTANCE: ${{ vars.GCE_INSTANCE }}
          GCE_ZONE: ${{ vars.GCE_ZONE }}
          # Public sshd host keys of rust-api-prod, collected by the operator
          # over IAP (read-only) and stored as a repository variable. Public
          # key material is not a secret; pinning it turns SSH host
          # verification from trust-on-first-use into strict checking.
          DEPLOY_HOST_PUBLIC_KEY: ${{ vars.DEPLOY_HOST_PUBLIC_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$GCP_PROJECT_ID"
          test -n "$GCE_INSTANCE"
          test -n "$GCE_ZONE"
          sha256sum --check rust-api.sha256
          # Fail before any connection is made if host pinning is not set up:
          # a deploy without a pinned host key must not fall back to TOFU.
          test -n "$DEPLOY_HOST_PUBLIC_KEY" || {
            echo "DEPLOY_HOST_PUBLIC_KEY repository variable is not set; refusing to deploy without pinned host keys" >&2
            exit 1
          }
          key="$RUNNER_TEMP/rust-api-deploy"
          ssh-keygen -q -t ed25519 -N '' -f "$key"
          common=(
            --project="$GCP_PROJECT_ID"
            --zone="$GCE_ZONE"
            --quiet
          )
          # Preserve operator keys, replace stale deploy keys, and add this
          # run's ten-minute key. This avoids gcloud compute ssh's unbounded
          # key-propagation wait on hosted runners.
          ssh_keys="$RUNNER_TEMP/instance-ssh-keys"
          gcloud compute instances describe "$GCE_INSTANCE" "${common[@]}" --format=json \
            | jq -r '.metadata.items[]? | select(.key == "ssh-keys") | .value' \
            | grep -v '^deploy:' >"$ssh_keys"
          # A failed describe or filter must abort before add-metadata: that
          # call REPLACES the ssh-keys metadata and would otherwise wipe the
          # operator's keys.
          test -s "$ssh_keys" || {
            echo "no operator SSH keys found in instance metadata; refusing to rewrite ssh-keys" >&2
            exit 1
          }
          expires="$(date --utc --date='+10 minutes' --iso-8601=seconds)"
          printf 'deploy:%s google-ssh {"userName":"deploy","expireOn":"%s"}\n' \
            "$(<"$key.pub")" "$expires" >>"$ssh_keys"
          gcloud compute instances add-metadata "$GCE_INSTANCE" "${common[@]}" \
            --metadata-from-file="ssh-keys=$ssh_keys"
          local_port=2222
          tunnel_log="$RUNNER_TEMP/iap-tunnel.log"
          gcloud compute start-iap-tunnel "$GCE_INSTANCE" 22 \
            --project="$GCP_PROJECT_ID" \
            --zone="$GCE_ZONE" \
            --local-host-port="127.0.0.1:${local_port}" \
            --iap-tunnel-disable-connection-check \
            --quiet >"$tunnel_log" 2>&1 &
          tunnel_pid=$!
          # shellcheck disable=SC2329  # invoked via trap EXIT below
          cleanup() {
            kill "$tunnel_pid" 2>/dev/null || true
            wait "$tunnel_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          # Pinned host keys, entries scoped to [127.0.0.1]:2222. With
          # StrictHostKeyChecking=yes a changed or unexpected host key fails
          # the job before any payload or command is sent.
          pinned_known_hosts="$RUNNER_TEMP/pinned_known_hosts"
          while IFS= read -r host_key; do
            printf '[127.0.0.1]:%s %s\n' "$local_port" "$host_key"
          done < <(printf '%s\n' "$DEPLOY_HOST_PUBLIC_KEY") >"$pinned_known_hosts"
          ssh_options=(
            -i "$key"
            -p "$local_port"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$pinned_known_hosts"
          )
          # With IAP's connection preflight disabled, gcloud does not emit a
          # "Listening on port" message. The authenticated SSH test below is
          # the readiness check for the tunnel and the VM.
          for _ in $(seq 1 30); do
            if ssh "${ssh_options[@]}" deploy@127.0.0.1 true; then
              break
            fi
            kill -0 "$tunnel_pid" 2>/dev/null || { cat "$tunnel_log" >&2; exit 1; }
            sleep 2
          done
          ssh "${ssh_options[@]}" deploy@127.0.0.1 true
          # Last stale-commit guard: if another push landed on main while
          # this run was building and connecting, its deploy owns production;
          # activating this artifact would regress it. Failing loudly here is
          # deliberate — we are seconds from activation. (Exit 2 from the
          # check — unverifiable — fails the job the same way: never activate
          # an artifact whose currency could not be proven.)
          rc=0
          latest_tip="$(bash .github/scripts/deploy-still-current.sh)" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "superseded or unverifiable (exit $rc): main is at ${latest_tip:-<unknown>}; refusing to activate ${GITHUB_SHA}" >&2
            exit 1
          fi
          destination="deploy@127.0.0.1:/home/deploy/incoming/rust-api-${GITHUB_SHA}"
          scp -i "$key" -P "$local_port" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$pinned_known_hosts" \
            rust-api \
            "$destination"
          digest="$(sha256sum rust-api | awk '{print $1}')"
          activate_cmd="sudo /usr/local/sbin/rust-api-activate '${GITHUB_SHA}' '${digest}'"
          # Client-side expansion is deliberate: the remote command must
          # receive this run's SHA and digest as literal arguments.
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" deploy@127.0.0.1 "$activate_cmd"
