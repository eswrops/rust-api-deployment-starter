# cargo-deny configuration for both the production crate (root) and the
# benchmark crate (benchmark/feed-api). CI runs `cargo deny check` against
# each manifest with this file.

[graph]
# Only the default host target graph is checked.

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
]
# Confidence below this (0.0-1.0) fails the license check.
confidence-threshold = 0.93

[advisories]
version = 2
# Vulnerabilities and yanked crates fail the check by default in v2;
# unmaintained warnings surface in the log without blocking CI.
yanked = "deny"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []

[sources]
# crates.io is allowed by default; anything else (registry or git source) is denied.
unknown-registry = "deny"
unknown-git = "deny"
